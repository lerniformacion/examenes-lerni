<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Food Defense — lerni</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --border: #E2DFDA;
    --border-strong: #C8C4BD;
    --text: #1A1916;
    --text-muted: #6B6860;
    --text-faint: #9B9890;
    --accent: #1A1916;
    --green: #1D6A4A;
    --green-bg: #EAF5EE;
    --red: #A3302D;
    --red-bg: #FAEEEE;
    --blue: #1A4A8A;
    --blue-bg: #EEF4FC;
    --orange: #8A4A1A;
    --orange-bg: #FCF4EE;
    --radius: 10px;
    --radius-sm: 6px;
  }

  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrapper {
    max-width: 640px;
    margin: 0 auto;
  }

  /* Header */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2.5rem;
  }
  .brand-logo {
    width: 32px;
    height: 32px;
    background: var(--text);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -1px;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .exam-header { margin-bottom: 2rem; }
  .exam-tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    background: var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .exam-title {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .exam-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 2rem;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-faint);
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
  }
  .progress-track {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Datos screen */
  .datos-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1rem;
  }
  .datos-card h3 {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 1.25rem;
    color: var(--text-muted);
  }
  .field {
    margin-bottom: 1rem;
  }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 14px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--text); }
  .field input::placeholder { color: var(--text-faint); }

  /* Question cards */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 10px;
    transition: border-color 0.2s;
    animation: fadeIn 0.3s ease forwards;
    opacity: 0;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  .question-card.answered { border-color: var(--border-strong); }
  .question-card.review-correct {
    border-left: 3px solid var(--green);
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .question-card.review-incorrect {
    border-left: 3px solid var(--red);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }
  .q-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .q-status-dot.answered { background: var(--text); }

  .q-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 1.25rem;
  }

  .vf-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .vf-btn {
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vf-btn .vf-label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .vf-btn:hover { border-color: var(--border-strong); background: var(--surface); }
  .vf-btn.sel-v { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
  .vf-btn.sel-v .vf-label { color: var(--blue); }
  .vf-btn.sel-f { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
  .vf-btn.sel-f .vf-label { color: var(--orange); }
  .vf-btn:disabled { cursor: default; }

  .feedback-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
  }
  .feedback-line.ok { background: var(--green-bg); color: var(--green); }
  .feedback-line.ko { background: var(--red-bg); color: var(--red); }
  .feedback-icon { font-size: 14px; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    background: var(--text);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 1rem;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.3; cursor: default; transform: none; }

  /* Result screen */
  .result-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .result-fraction {
    font-size: 56px;
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 6px;
  }
  .result-fraction .denom { font-size: 32px; color: var(--text-muted); }
  .result-pct {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 1rem;
  }
  .result-verdict {
    display: inline-block;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 1rem;
  }
  .verdict-apto { background: var(--green-bg); color: var(--green); }
  .verdict-no-apto { background: var(--red-bg); color: var(--red); }
  .verdict-revisar { background: var(--orange-bg); color: var(--orange); }
  .result-name {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
    margin-top: 1.5rem;
  }

  .email-status {
    text-align: center;
    font-size: 13px;
    color: var(--text-faint);
    padding: 1rem 0 0;
    font-family: 'DM Mono', monospace;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .exam-title { font-size: 22px; }
    .result-fraction { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="brand">
    <div class="brand-logo">le</div>
    <span class="brand-name">lerni</span>
  </div>

  <!-- SCREEN: DATOS -->
  <div class="screen active" id="screen-datos">
    <div class="exam-header">
      <span class="exam-tag">Evaluación</span>
      <h1 class="exam-title">Food Defense</h1>
      <p class="exam-subtitle">Indica si cada afirmación es verdadera (V) o falsa (F). Se mostrarán 10 preguntas.</p>
    </div>
    <div class="datos-card">
      <h3>Identifícate para comenzar</h3>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="inp-nombre" placeholder="Tu nombre" autocomplete="given-name" />
      </div>
      <div class="field">
        <label>Apellidos</label>
        <input type="text" id="inp-apellidos" placeholder="Tus apellidos" autocomplete="family-name" />
      </div>
    </div>
    <button class="btn-primary" onclick="startExam()">Comenzar examen →</button>
  </div>

  <!-- SCREEN: EXAMEN -->
  <div class="screen" id="screen-exam">
    <div class="exam-header">
      <span class="exam-tag">Food Defense</span>
      <h1 class="exam-title">Verdadero o Falso</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="prog-text">0 / 10 respondidas</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div id="questions-container"></div>
    <button class="btn-primary" id="btn-submit" onclick="submitExam()" disabled>Enviar respuestas</button>
  </div>

  <!-- SCREEN: RESULTADO -->
  <div class="screen" id="screen-result">
    <div class="result-hero">
      <div class="result-fraction" id="res-fraction"></div>
      <div class="result-pct" id="res-pct"></div>
      <div class="result-verdict" id="res-verdict"></div>
      <div class="result-name" id="res-name"></div>
    </div>
    <div class="section-label">Revisión detallada</div>
    <div id="review-container"></div>
    <div class="email-status" id="email-status">Enviando resultados...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
const EMAILJS_SERVICE = 'service_ei3b69m';
const EMAILJS_TEMPLATE = 'template_cdqzipe';
const EMAILJS_KEY = 'KsyEkIJZWQA6EOoFM';
const DEST_EMAIL = 'info@lerni.es';

const questions = [
  { text: "La OMS identificó la contaminación intencional de los alimentos como una de las principales amenazas a la salud global del siglo XXI.", answer: "V" },
  { text: "No es necesario que el personal que participe en evaluaciones de amenazas y planes de protección de los alimentos, tenga conocimientos sobre los principios de protección de los alimentos, según requisitos de BRCGS Food.", answer: "F" },
  { text: "A la hora de evaluar quién podría querer atacarnos, tenemos que tener en consideración el personal resentido.", answer: "V" },
  { text: "Se debe utilizar un enfoque preventivo, aplicando medidas para reducir el riesgo de amenazas en un Sistema de Defensa Alimentaria.", answer: "V" },
  { text: "El uso de lector de huella dactilar o lector de tarjeta para entrar a las instalaciones son medidas obligatorias para el control de entrada y salida a las instalaciones.", answer: "F" },
  { text: "Las empresas deberían implantar medidas para el control de accesos, zona exterior e interior del edificio, recepciones y envíos, personal interno y externo, etc.", answer: "V" },
  { text: "Un paquete sospechoso es aquel que está sellado excesivamente con cinta adhesiva, tiene un peso fuera de lo normal, proviene de un remitente no conocido, etc.", answer: "V" },
  { text: "Ante situaciones de seguridad preocupantes, se reúne el equipo y toma las decisiones en base al resultado de una tormenta de ideas.", answer: "F" },
  { text: "Hay una metodología establecida con etapas y criterios definidos para realizar una evaluación de amenazas.", answer: "F" },
  { text: "Para comprobar si el Sistema Food Defense implantado es eficaz siempre hay que realizar un simulacro anual de intento de acceso a las instalaciones.", answer: "F" }
];

let alumno = {};
let respuestas = {};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startExam() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const apellidos = document.getElementById('inp-apellidos').value.trim();
  if (!nombre || !apellidos) {
    alert('Por favor, introduce tu nombre y apellidos para continuar.');
    return;
  }
  alumno = { nombre, apellidos, full: nombre + ' ' + apellidos };
  showScreen('screen-exam');
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'question-card';
    div.id = 'qcard-' + i;
    div.style.animationDelay = (i * 0.04) + 's';
    div.innerHTML = `
      <div class="q-meta">
        <span class="q-num">${String(i + 1).padStart(2, '0')}</span>
        <span class="q-status-dot" id="dot-${i}"></span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="vf-buttons">
        <button class="vf-btn" id="btn-v-${i}" onclick="selectAnswer(${i},'V')">
          <span class="vf-label">V</span> Verdadero
        </button>
        <button class="vf-btn" id="btn-f-${i}" onclick="selectAnswer(${i},'F')">
          <span class="vf-label">F</span> Falso
        </button>
      </div>
    `;
    container.appendChild(div);
  });
}

function selectAnswer(i, val) {
  respuestas[i] = val;
  const btnV = document.getElementById('btn-v-' + i);
  const btnF = document.getElementById('btn-f-' + i);
  const dot = document.getElementById('dot-' + i);
  btnV.className = 'vf-btn' + (val === 'V' ? ' sel-v' : '');
  btnF.className = 'vf-btn' + (val === 'F' ? ' sel-f' : '');
  dot.classList.add('answered');
  document.getElementById('qcard-' + i).classList.add('answered');

  const answered = Object.keys(respuestas).length;
  const pct = Math.round(answered / questions.length * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = answered + ' / ' + questions.length + ' respondidas';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('btn-submit').disabled = answered < questions.length;
}

function submitExam() {
  let correctas = 0;
  const detalleLines = [];

  questions.forEach((q, i) => {
    const r = respuestas[i];
    const ok = r === q.answer;
    if (ok) correctas++;
    detalleLines.push('P' + (i + 1) + ': Respondida ' + r + ' → ' + (ok ? 'Correcta ✓' : 'Incorrecta ✗ (correcta: ' + q.answer + ')'));
  });

  const pct = Math.round(correctas / questions.length * 100);
  document.getElementById('res-fraction').innerHTML = correctas + '<span class="denom">/10</span>';
  document.getElementById('res-pct').textContent = pct + '% de aciertos';
  document.getElementById('res-name').textContent = alumno.full;

  const verdictEl = document.getElementById('res-verdict');
  if (correctas >= 8) {
    verdictEl.textContent = 'Apto';
    verdictEl.className = 'result-verdict verdict-apto';
  } else if (correctas >= 6) {
    verdictEl.textContent = 'Revisar conceptos';
    verdictEl.className = 'result-verdict verdict-revisar';
  } else {
    verdictEl.textContent = 'No apto — requiere refuerzo';
    verdictEl.className = 'result-verdict verdict-no-apto';
  }

  showScreen('screen-result');
  renderReview();
  sendEmail(correctas, pct, detalleLines.join('\n'));
}

function renderReview() {
  const container = document.getElementById('review-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const r = respuestas[i];
    const ok = r === q.answer;
    const div = document.createElement('div');
    div.className = 'question-card ' + (ok ? 'review-correct' : 'review-incorrect');
    div.innerHTML = `
      <div class="q-meta">
        <span class="q-num">${String(i + 1).padStart(2, '0')}</span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="feedback-line ${ok ? 'ok' : 'ko'}">
        <span class="feedback-icon">${ok ? '✓' : '✗'}</span>
        ${ok
          ? 'Correcto — respuesta: <strong>' + r + '</strong>'
          : 'Incorrecto — tu respuesta: <strong>' + r + '</strong> · Correcta: <strong>' + q.answer + '</strong>'
        }
      </div>
    `;
    container.appendChild(div);
  });
}

function sendEmail(correctas, pct, detalle) {
  const statusEl = document.getElementById('email-status');
  const fecha = new Date().toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' });

  emailjs.init(EMAILJS_KEY);
  emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
    alumno_nombre: alumno.full,
    fecha: fecha,
    puntuacion: correctas + '/10 (' + pct + '%)',
    detalle: detalle,
    to_email: DEST_EMAIL
  }).then(() => {
    statusEl.textContent = '✓ Resultados enviados a ' + DEST_EMAIL;
  }).catch((err) => {
    statusEl.textContent = 'El envío automático falló. Anota el resultado manualmente.';
    console.error('EmailJS error:', err);
  });
}
</script>
</body>
</html>
